version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laughingstock2_web
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laughingstock2.rule=Host(`ls.informatrixlabs.com`)"
      - "traefik.http.routers.laughingstock2.entrypoints=websecure"
      - "traefik.http.routers.laughingstock2.tls.certresolver=letsencrypt"
      - "traefik.http.services.laughingstock2.loadbalancer.server.port=9999"

networks:
  proxy:
    external: true
