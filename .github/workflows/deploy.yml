name: Deploy LaughingStock to VPS via Traefik

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync Source Code to VPS
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='.DS_Store' \
            . "$VPS_USER@$VPS_HOST:~/laughingstock2/"

      - name: Write Production Environment Variables
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
          DATABASE_URL_VAL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET_VAL: ${{ secrets.NEXTAUTH_SECRET || 'laughingstock_super_secret_jwt_key_2026' }}
          NEXTAUTH_URL_VAL: ${{ secrets.NEXTAUTH_URL || 'https://ls.informatrixlabs.com' }}
          JEV_API_ENDPOINT_VAL: ${{ secrets.JEV_API_ENDPOINT || 'http://localhost:3000/api/jev-mock' }}
          MARKET_DATA_PROVIDER_VAL: ${{ secrets.MARKET_DATA_PROVIDER || 'alpaca' }}
          ALPACA_PAPER_VAL: ${{ secrets.ALPACA_PAPER || 'true' }}
          ALPACA_API_KEY_VAL: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY_VAL: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL_VAL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p ~/laughingstock2"
          ssh "$VPS_USER@$VPS_HOST" << ENDSSH
          if [ ! -f ~/laughingstock2/.env ]; then
            cat << 'EOF' > ~/laughingstock2/.env
NEXTAUTH_SECRET="$NEXTAUTH_SECRET_VAL"
NEXTAUTH_URL="$NEXTAUTH_URL_VAL"
JEV_API_ENDPOINT="$JEV_API_ENDPOINT_VAL"
MARKET_DATA_PROVIDER="$MARKET_DATA_PROVIDER_VAL"
ALPACA_PAPER="$ALPACA_PAPER_VAL"
ALPACA_API_KEY="$ALPACA_API_KEY_VAL"
ALPACA_SECRET_KEY="$ALPACA_SECRET_KEY_VAL"
ALPACA_BASE_URL="$ALPACA_BASE_URL_VAL"
EOF
          fi
          if [ -n "$DATABASE_URL_VAL" ]; then
            if grep -q "^DATABASE_URL=" ~/laughingstock2/.env; then
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DATABASE_URL_VAL|" ~/laughingstock2/.env
            else
              echo "DATABASE_URL=$DATABASE_URL_VAL" >> ~/laughingstock2/.env
            fi
          fi
          ENDSSH

      - name: Build and Start Containers via Docker Compose
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          ssh "$VPS_USER@$VPS_HOST" << 'ENDSSH'
          set -e
          cd ~/laughingstock2

          docker compose build
          docker compose up -d
          docker compose ps
          ENDSSH
