name: Deploy LaughingStock to VPS via Traefik

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync Source Code to VPS
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='.DS_Store' \
            . "$VPS_USER@$VPS_HOST:~/laughingstock2/"

      - name: Write Production Environment Variables
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
          DATABASE_URL_VAL: ${{ secrets.DATABASE_URL }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p ~/laughingstock2"
          ssh "$VPS_USER@$VPS_HOST" "bash -s" << 'ENDSSH'
          if [ ! -f ~/laughingstock2/.env ]; then
            cat << 'EOF' > ~/laughingstock2/.env
NEXTAUTH_SECRET="laughingstock_super_secret_jwt_key_2026"
NEXTAUTH_URL="https://ls.informatrixlabs.com"
JEV_API_ENDPOINT="http://localhost:3000/api/jev-mock"
MARKET_DATA_PROVIDER="alpaca"
ALPACA_PAPER="true"
ALPACA_BASE_URL="https://paper-api.alpaca.markets/v2"
EOF
          fi

          # Never overwrite DATABASE_URL if it already exists on the server's .env file
          if [ -n "$DATABASE_URL_VAL" ] && ! grep -q "^DATABASE_URL=" ~/laughingstock2/.env 2>/dev/null; then
            echo "DATABASE_URL=$DATABASE_URL_VAL" >> ~/laughingstock2/.env
          fi
          ENDSSH

      - name: Build and Start Containers via Docker Compose
        env:
          VPS_USER_SECRET: ${{ secrets.VPS_USER }}
          VPS_HOST_SECRET: ${{ secrets.VPS_HOST }}
        run: |
          VPS_USER="${VPS_USER_SECRET:-root}"
          VPS_HOST="${VPS_HOST_SECRET:-45.132.240.168}"
          ssh "$VPS_USER@$VPS_HOST" << 'ENDSSH'
          set -e
          cd ~/laughingstock2

          docker compose build
          docker compose up -d --remove-orphans
          sleep 3
          docker compose ps
          docker compose logs --tail=30
          ENDSSH
