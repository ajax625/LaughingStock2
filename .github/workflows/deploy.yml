name: Deploy LaughingStock to VPS via Traefik

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync Source Code to VPS
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='.DS_Store' \
            . ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST || '45.132.240.168' }}:~/laughingstock2/

      - name: Write Production Environment Variables
        env:
          APP_ENV: |
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'laughingstock' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'laughingstockpass123' }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'laughingstock2_prod' }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER || 'laughingstock' }}:${{ secrets.POSTGRES_PASSWORD || 'laughingstockpass123' }}@db:5432/${{ secrets.POSTGRES_DB || 'laughingstock2_prod' }}?schema=public
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET || 'laughingstock_super_secret_jwt_key_2026' }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL || 'https://ls.informatrixlabs.com' }}
            JEV_API_ENDPOINT=${{ secrets.JEV_API_ENDPOINT || 'http://localhost:3000/api/jev-mock' }}
        run: |
          ssh ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST || '45.132.240.168' }} "mkdir -p ~/laughingstock2"
          echo "$APP_ENV" | ssh ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST || '45.132.240.168' }} "cat > ~/laughingstock2/.env"

      - name: Build and Start Containers via Docker Compose
        run: |
          ssh ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST || '45.132.240.168' }} << 'ENDSSH'
          set -e
          cd ~/laughingstock2

          docker compose build
          docker compose up -d
          docker compose ps
          ENDSSH
